name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/brant-satoshi/personal-blog
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production site URL
        run: |
          node -e 'const value=process.env.SITE_URL; if (!value) throw new Error("Repository variable SITE_URL is required"); const url=new URL(value); if (url.protocol !== "https:") throw new Error("SITE_URL must use https"); if (["localhost", "127.0.0.1"].includes(url.hostname)) throw new Error("SITE_URL must be the public production origin")'

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,GITHUB_SHA,SITE_URL
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            mkdir -p ~/personal-blog
            cd ~/personal-blog

            cat > docker-compose.yml <<EOF
            services:
              blog:
                image: ${IMAGE}:${GITHUB_SHA}
                environment:
                  LIKES_DIR: /app/data
                  SITE_URL: "${SITE_URL}"
                ports:
                  - "3000:3000"
                restart: unless-stopped
                volumes:
                  - blog-data:/app/data
            volumes:
              blog-data:
            EOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          SITE_URL: ${{ env.SITE_URL }}
