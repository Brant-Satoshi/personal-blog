name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> $GITHUB_OUTPUT; echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT;
          elif [ -f yarn.lock ]; then echo "name=yarn" >> $GITHUB_OUTPUT; echo "install=yarn install --frozen-lockfile" >> $GITHUB_OUTPUT;
          else echo "name=npm" >> $GITHUB_OUTPUT; echo "install=npm ci" >> $GITHUB_OUTPUT;
          fi

      - name: Setup pnpm (if needed)
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: ${{ steps.pm.outputs.install }}

      - name: Lint
        run: |
          if npm run -s lint --if-present; then
            echo "lint ok"
          fi

      - name: Typecheck
        run: |
          if npm run -s typecheck --if-present; then
            echo "typecheck ok"
          fi

      - name: Test
        run: |
          if npm run -s test --if-present; then
            echo "tests ok"
          fi

      - name: Build
        run: npm run -s build
