services:
  blog:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      LIKES_DIR: /app/data
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - blog-likes:/app/data

volumes:
  blog-likes:
